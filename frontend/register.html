<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | iCoope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login">
    <section class="brand" aria-hidden="true">
      <p class="wordmark">i<span>Coope</span></p>
      <p class="tagline">La cooperadora de tu escuela, en un solo lugar.</p>
    </section>

    <section class="panel">
      <form id="register-form" class="form wide" novalidate>
        <h1>Crear cuenta</h1>
        <p class="lead">Completá tus datos para registrarte.</p>

        <div class="row">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" autocomplete="given-name" maxlength="100" required>
            <p class="field-error" id="nombre-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="apellido">Apellido</label>
            <input id="apellido" type="text" autocomplete="family-name" maxlength="100" required>
            <p class="field-error" id="apellido-error" role="alert"></p>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" maxlength="150" required>
          <p class="field-error" id="email-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="telefono">Teléfono (opcional)</label>
          <input id="telefono" type="tel" autocomplete="tel" maxlength="30">
          <p class="field-error" id="telefono-error" role="alert"></p>
        </div>

        <div class="row">
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="new-password" maxlength="128" required>
            <p class="hint">Mínimo 8 caracteres.</p>
            <p class="field-error" id="password-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="password2">Repetir contraseña</label>
            <input id="password2" type="password" autocomplete="new-password" maxlength="128" required>
            <p class="field-error" id="password2-error" role="alert"></p>
          </div>
        </div>

        <button type="submit" id="submit" class="submit">Crear cuenta</button>
        <p class="switch">¿Ya tenés cuenta? <a href="login.html">Ingresar</a></p>
      </form>
    </section>
  </main>

  <dialog id="result-dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <div class="dialog-icon" id="dialog-icon" aria-hidden="true"></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <button type="button" id="dialog-close" class="submit dialog-close">Entendido</button>
  </dialog>

  <script src="js/register.js"></script>
</body>
</html>
