<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | iCoope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login">
    <section class="brand" aria-hidden="true">
      <p class="wordmark">i<span>Coope</span></p>
      <p class="tagline">La cooperadora de tu escuela, en un solo lugar.</p>
    </section>

    <section class="panel">
      <form id="login-form" class="form" novalidate>
        <h1>Ingresar</h1>
        <p class="lead">Usá el email con el que te registraste.</p>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="150">
          <p class="field-error" id="email-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
            <button type="button" id="toggle-password" class="toggle" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
          </div>
          <p class="field-error" id="password-error" role="alert"></p>
        </div>

        <button type="submit" id="submit" class="submit">Ingresar</button>
        <p class="switch">¿No tenés cuenta? <a href="register.html">Registrate</a></p>
      </form>
    </section>
  </main>

  <dialog id="result-dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <div class="dialog-icon" id="dialog-icon" aria-hidden="true"></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <button type="button" id="dialog-close" class="submit dialog-close">Entendido</button>
  </dialog>

  <script src="js/login.js"></script>
</body>
</html>
